<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dyd-test 测试任务看板</title>
<style>
:root {
  color-scheme: light;
  --ink: #161e36; --muted: #52617a; --line: #e0e6f0;
  --passed: #149975; --failed: #d64961; --blocked: #c78322;
  font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", system-ui, sans-serif;
  font-variant-numeric: tabular-nums;
  color: var(--ink); background: #f3f5fa;
}
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; line-height: 1.55; }
h1, h2, p { margin: 0; }
a { color: inherit; text-decoration: none; }
:focus-visible { outline: 2px solid #6671e6; outline-offset: 3px; }
.shell { width: min(1200px, calc(100% - 64px)); margin: auto; }
.masthead { background: #fff; border-bottom: 1px solid var(--line); }
.masthead .shell { display: flex; align-items: center; justify-content: space-between; min-height: 64px; gap: 16px; }
.brand { display: flex; align-items: center; gap: 10px; font: 750 19px/1 system-ui, sans-serif; }
.brand-mark { display: grid; place-items: center; width: 29px; height: 29px; border-radius: 9px; background: #5554bc; color: white; }
nav { display: flex; gap: 24px; color: var(--muted); font-size: 13px; font-weight: 600; }
main { padding-block: 30px 48px; }
.hero {
  color: #fff; border-radius: 22px; overflow: hidden; box-shadow: 0 15px 32px #20284d1f;
  background: radial-gradient(ellipse at 94% 4%, #434284 0%, transparent 62%), linear-gradient(115deg, #151c38, #222856);
}
.hero-inner { display: grid; grid-template-columns: 1.05fr 1fr; gap: 28px; align-items: center; padding: 30px 34px; }
.project { color: #d4d8f4; font-size: 13px; font-weight: 650; overflow-wrap: anywhere; }
h1 { margin: 4px 0 17px; font-size: clamp(30px, 4vw, 44px); letter-spacing: -.055em; line-height: 1.16; }
.gate { display: inline-flex; gap: 8px; align-items: center; padding: 6px 12px; border-radius: 8px; font-size: 13px; font-weight: 700; color: #e0e5fa; background: #ffffff20; }
.gate.passed { color: #a5f2d6; background: #59dfaa20; }
.gate.failed { color: #ffc0ca; background: #ff789528; }
.gate.blocked { color: #ffe1a7; background: #ffc96624; }
.gate::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.task-meta { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 16px; padding: 15px 18px; border: 1px solid #ffffff26; border-radius: 14px; background: #ffffff0b; }
.task-meta dt { font-size: 11px; color: #c8ceed; }
.task-meta dd { margin: 3px 0 0; font-size: 13px; font-weight: 650; overflow-wrap: anywhere; }
.environment { grid-column: 1 / -1; padding-top: 9px; border-top: 1px solid #ffffff21; }
.release { padding: 10px 34px; color: #d4d8f4; border-top: 1px solid #ffffff25; font-size: 13px; }
.release.failed { color: #ffc0ca; }
.task-reasons { padding: 13px 34px; color: #ffe5ea; background: #ffffff11; border-top: 1px solid #ffffff25; font-size: 13px; }
.task-reasons summary { padding: 0; font-size: inherit; }
.task-reasons ul { margin: 8px 0 0; padding-inline-start: 18px; }
.task-reasons li + li { margin-top: 4px; }
.section-title { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 25px 2px 12px; }
.section-title h2 { font-size: 20px; letter-spacing: -.03em; }
.caption { color: var(--muted); font-size: 12px; }
.run-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
.run-card { display: grid; gap: 7px; padding: 19px; border: 1px solid var(--line); border-left: 4px solid var(--status); border-radius: 13px; background: #fff; box-shadow: 0 5px 15px #23305308; }
.run-card:hover { border-color: #bcb7e4; box-shadow: 0 9px 24px #34318817; }
.run-card.passed { --status: var(--passed); }
.run-card.failed { --status: var(--failed); }
.run-card.blocked { --status: var(--blocked); }
.run-card strong { font-size: 16px; overflow-wrap: anywhere; }
.run-index { color: var(--muted); font-size: 11px; font-weight: 750; letter-spacing: .08em; }
.run-numbers { color: #475577; font-size: 13px; }
.run-meta-line { color: var(--muted); font-size: 12px; }
.run-list { display: grid; gap: 14px; }
.run-panel { border: 1px solid var(--line); border-radius: 14px; background: #fff; overflow: hidden; box-shadow: 0 5px 15px #23305308; scroll-margin-top: 16px; }
.run-panel > summary { display: flex; align-items: center; gap: 12px; padding: 15px 19px; cursor: pointer; }
.run-panel > summary span:first-child { color: var(--muted); font-size: 11px; font-weight: 750; letter-spacing: .08em; }
.run-panel > summary strong { margin-right: auto; overflow-wrap: anywhere; }
.run-body { padding: 0 19px 19px; border-top: 1px solid var(--line); }
.run-stats { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; margin: 16px 0; }
.run-stats div { display: grid; gap: 3px; padding: 10px 11px; border-radius: 9px; background: #f4f5fc; }
.run-stats span { color: var(--muted); font-size: 11px; }
.run-stats strong { color: #343188; font-size: 18px; }
.run-section { margin-top: 15px; }
.run-section h2 { margin-bottom: 8px; font-size: 16px; }
.run-panel .reasons { padding: 10px 12px; color: #8a4e09; background: #fff8e8; border-radius: 9px; }
.run-panel .reasons ul { margin: 0; padding-inline-start: 18px; }
.table-scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; }
table { border-collapse: collapse; width: 100%; table-layout: fixed; font-size: 13px; }
th, td { padding: 9px 11px; text-align: left; border-bottom: 1px solid #edf0f6; vertical-align: top; overflow-wrap: anywhere; }
th { color: var(--muted); background: #f7f8fc; font-size: 12px; font-weight: 650; }
th:first-child, td:first-child { width: 18%; }
th:last-child, td:last-child { width: 16%; }
tr:last-child td { border-bottom: 0; }
.identifier { color: #475577; font: 12px "Cascadia Mono", Consolas, ui-monospace, monospace; }
.row-note { display: block; color: var(--muted); font-size: 12px; white-space: pre-line; }
.badge { display: inline-block; padding: 2px 7px; border-radius: 6px; color: #445473; background: #edf0f6; white-space: nowrap; font-size: 11px; font-weight: 750; }
.badge.passed { color: #087354; background: #e1f6ed; }
.badge.failed { color: #a92742; background: #fce8ed; }
.badge.blocked { color: #8a4e09; background: #fff1d8; }
.badge.skipped { color: #335b91; background: #e8f0ff; }
.badge.unknown { color: #7034a1; background: #f4e9ff; }
.empty { padding: 20px; color: var(--muted); text-align: center; }
.report { margin-top: 15px; border: 1px solid var(--line); border-radius: 10px; }
.report > summary { padding: 12px 15px; cursor: pointer; font-weight: 700; }
.report-reading { display: grid; grid-template-columns: minmax(142px, 176px) minmax(0, 1fr); gap: 16px; padding: 16px; background: #f7f8fc; border-top: 1px solid var(--line); }
.toc, .paper { border: 1px solid var(--line); border-radius: 10px; background: #fff; }
.toc { position: sticky; top: 16px; display: grid; gap: 4px; align-self: start; padding: 12px; }
.toc a { padding: 4px 6px; border-radius: 5px; color: #4c42ad; font-size: 13px; }
.chapters { min-width: 0; display: grid; gap: 11px; }
.paper { padding: 17px; overflow-wrap: anywhere; }
.paper h2 { padding-bottom: 8px; border-bottom: 1px solid var(--line); font-size: 16px; }
.paper ul { margin: 5px 0 0; padding-inline-start: 20px; }
.paper > ul { padding: 0; list-style: none; }
.paper > ul > li { padding: 8px 0; }
.paper > ul > li + li { border-top: 1px solid #edf0f6; }
.paper .stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 18px; }
.paper .stats > ul > li { display: flex; justify-content: space-between; gap: 8px; }
.report-text { white-space: pre-wrap; margin-top: 8px; }
.raw summary { padding: 0; color: #4c42ad; cursor: pointer; font-size: 13px; }
pre { margin: 12px 0 0; padding: 12px; border-radius: 8px; background: #f3f5fa; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 12px; }
@media (max-width: 900px) {
  .run-stats { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .report-reading { grid-template-columns: 1fr; }
  .toc { position: static; display: flex; flex-wrap: wrap; }
}
@media (max-width: 720px) {
  .shell { width: calc(100% - 32px); }
  .hero-inner { grid-template-columns: 1fr; padding: 21px; }
  .run-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .paper .stats { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<header class="masthead">
  <div class="shell">
    <a href="#overview" class="brand"><span class="brand-mark" aria-hidden="true">✓</span>dyd-test</a>
    <nav aria-label="看板导航"><a href="#overview">任务总览</a><a href="#runs">运行明细</a></nav>
  </div>
</header>
<main class="shell" id="overview">
  <header class="hero">
    <div class="hero-inner">
      <div>
        <p class="project">${project}</p>
        <h1>测试任务看板</h1>
        <p class="gate ${tone}">${verdict}</p>
      </div>
      <dl class="task-meta">
        <div><dt>运行数量</dt><dd>${run_count} 个运行 · 1 个看板</dd></div>
        <div><dt>测试版本</dt><dd>${version}</dd></div>
        <div><dt>需求标识</dt><dd>${task_id}</dd></div>
        <div class="environment"><dt>测试环境</dt><dd>${environment}</dd></div>
      </dl>
    </div>
    ${release}
    ${reasons}
  </header>
  <div class="section-title"><h2>运行结果</h2><p class="caption">整体结论取最严重结果，统计不跨运行相加</p></div>
  <section class="run-grid" aria-label="运行结果">${cards}</section>
  <div class="section-title" id="runs"><h2>运行明细</h2><p class="caption">逐项查看用例、缺陷和报告原文</p></div>
  <section class="run-list">${panels}</section>
</main>
</body>
</html>
